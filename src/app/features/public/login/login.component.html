<!-- Login Page -->
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <!-- Welcome Section -->
                

                <!-- Login Card -->
                <div class="card login-card border-0 shadow-lg">
                    <div class="text-center mb-1 p-4 p-md-">
                    <h2 class="h2 text-muted fw-normal">Bienvenue sur</h2>
                    <h4 class="fw-bold text-primary mb-">
                        Système de Gestion de Rendez-vous Médicaux
                    </h4>
                    
                </div>
                    <div class="card-body p- p-md-5">
                        <div class="text-center mb-1">
                            <h2 class="card-title fw-bold text-dark mb-1">Se connecter</h2>
                            <p class="text-muted">Accédez à votre espace personnel</p>
                        </div>

                        <form id="loginForm">
                            <!-- Email/Username Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold mb-2">
                                    Email ou nom d'utilisateur
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="email" 
                                           placeholder="Entrez votre email ou nom d'utilisateur"
                                           required>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold mb-2">
                                    Mot de passe
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control" 
                                           id="password" 
                                           placeholder="Entrez votre mot de passe"
                                           required>
                                </div>
                            </div>

                            <!-- Forgot Password -->
                            <div class="mb-3 text-end">
                                <a href="#" class="text-decoration-none text-primary small">
                                    Mot de passe oublié?
                                </a>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary">
                                    Se connecter
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="position-relative mb-4">
                                <hr class="text-muted">
                                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">
                                    ou
                                </span>
                            </div>

                            <!-- Register Link -->
                            <div class="text-center">
                                <p class="mb-0 text-muted">
                                    Pas encore inscrit?
                                    <a href="#" class="text-decoration-none fw-semibold text-primary ms-1">
                                        S'inscrire
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-4">
                    <p class="text-muted small">
                        <i class="bi bi-shield-check me-1"></i>
                        Votre sécurité est notre priorité. Toutes les données sont cryptées.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
